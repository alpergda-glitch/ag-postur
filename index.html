<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />
  <meta name="theme-color" content="#0d141b" />
  <title>AG Postür</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0d141b;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      max-width: 720px;
      margin: 0 auto;
      padding: 14px;
    }

    .header {
      margin-bottom: 14px;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
    }

    .sub {
      color: #91a0ab;
      font-size: 14px;
      margin-top: 4px;
    }

    .card {
      background: #18232d;
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 14px;
    }

    label {
      display: block;
      color: #a6b1ba;
      font-size: 13px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 11px;
      padding: 0 12px;
      font-size: 16px;
    }

    button {
      width: 100%;
      min-height: 50px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      margin-top: 10px;
      cursor: pointer;
    }

    .primary {
      background: white;
      color: #101820;
    }

    .dark {
      background: #293946;
      color: white;
    }

    .successBtn {
      background: #1f7a45;
      color: white;
    }

    .disabledBtn {
      background: #26313a;
      color: #6f7d88;
      cursor: not-allowed;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .mode-btn {
      margin-top: 0;
      background: #293946;
      color: white;
    }

    .mode-btn.active {
      background: white;
      color: #101820;
    }

    .mode-btn.done::after {
      content: " ✓";
    }

    .camera-wrap {
      position: relative;
      width: 100%;
      background: black;
      border-radius: 16px;
      overflow: hidden;
    }

    video,
    canvas {
      width: 100%;
      display: block;
    }

    video {
      background: black;
      object-fit: cover;
    }

    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .center-line {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 2px;
      background: rgba(47,255,108,.95);
      transform: translateX(-50%);
    }

    .grid-line-v,
    .grid-line-h {
      position: absolute;
      background: rgba(255,255,255,.12);
    }

    .grid-line-v {
      top: 0;
      bottom: 0;
      width: 1px;
    }

    .grid-line-h {
      left: 0;
      right: 0;
      height: 1px;
    }

    .guide-line {
      position: absolute;
      height: 2px;
      background: rgba(255,210,30,.95);
    }

    .guide-head {
      position: absolute;
      border: 2px solid rgba(255,255,255,.8);
      border-radius: 50%;
    }

    .body-left,
    .body-right {
      position: absolute;
      border-left: 2px solid rgba(255,255,255,.38);
      height: 65%;
      top: 20%;
    }

    .status {
      margin-top: 12px;
      padding: 12px;
      border-radius: 12px;
      background: #22313d;
      text-align: center;
      font-size: 14px;
      line-height: 1.4;
    }

    .status-ok {
      background: #173424;
      color: #cdf7d7;
    }

    .status-warn {
      background: #4a3b1d;
      color: #ffe9a9;
    }

    .hidden {
      display: none;
    }

    .preview-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .shots {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .shot-box {
      background: #101820;
      border-radius: 12px;
      padding: 8px;
      text-align: center;
      min-width: 0;
    }

    .shot-box img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      border-radius: 9px;
      background: #000;
    }

    .shot-label {
      margin-top: 6px;
      font-size: 12px;
      color: #a9b4bd;
    }

    .help {
      font-size: 13px;
      color: #9da9b4;
      line-height: 1.5;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">AG POSTÜR</div>
    <div class="sub">3 Yönlü Canlı Çekim • PWA V2</div>
  </div>

  <div class="card">
    <label>Danışan</label>

    <input
      id="danisan"
      type="text"
      placeholder="Danışanın adını yaz"
    />

    <div class="mode-grid">
      <button class="mode-btn active" data-mode="on">ÖN</button>
      <button class="mode-btn" data-mode="yan">YAN</button>
      <button class="mode-btn" data-mode="arka">ARKA</button>
    </div>

    <button id="kameraAc" class="primary">
      📷 Canlı Kamerayı Aç
    </button>

    <div class="help">
      Her görünüş için ayrı fotoğraf çekeceğiz. Çekilen fotoğraf otomatik olarak o moda kaydedilir.
    </div>
  </div>

  <div id="cameraCard" class="card hidden">

    <div class="camera-wrap">

      <video
        id="video"
        autoplay
        playsinline
        muted>
      </video>

      <div id="overlay" class="overlay"></div>

    </div>

    <div id="status" class="status">
      Kamera hazırlanıyor...
    </div>

    <button id="fotoCek" class="primary">
      FOTOĞRAFI ÇEK
    </button>

    <button id="kameraKapat" class="dark">
      Kamerayı Kapat
    </button>

  </div>

  <div id="previewCard" class="card hidden">

    <div class="preview-title">
      Çekilen Görüntü
    </div>

    <canvas id="canvas"></canvas>

    <button id="kullan" class="successBtn">
      Bu Fotoğrafı Kullan
    </button>

    <button id="yeniden" class="dark">
      Yeniden Çek
    </button>

  </div>

  <div class="card">

    <div class="preview-title">
      Çekimler
    </div>

    <div class="shots">

      <div class="shot-box">
        <img id="shotOn" alt="Ön çekim" />
        <div class="shot-label">ÖN</div>
      </div>

      <div class="shot-box">
        <img id="shotYan" alt="Yan çekim" />
        <div class="shot-label">YAN</div>
      </div>

      <div class="shot-box">
        <img id="shotArka" alt="Arka çekim" />
        <div class="shot-label">ARKA</div>
      </div>

    </div>

    <button
      id="analizeGec"
      class="disabledBtn"
      disabled>
      3 FOTOĞRAF TAMAMLANINCA ANALİZE GEÇ
    </button>

  </div>

</div>

<script>
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const cameraCard = document.getElementById("cameraCard");
  const previewCard = document.getElementById("previewCard");
  const statusBox = document.getElementById("status");
  const overlay = document.getElementById("overlay");
  const analyzeButton = document.getElementById("analizeGec");

  let stream = null;
  let currentMode = "on";
  let pendingPhoto = null;

  const photos = {
    on: null,
    yan: null,
    arka: null
  };

  const labels = {
    on: "Ön",
    yan: "Yan",
    arka: "Arka"
  };

  document.querySelectorAll(".mode-btn").forEach(button => {
    button.addEventListener("click", () => {
      document.querySelectorAll(".mode-btn").forEach(btn => {
        btn.classList.remove("active");
      });

      button.classList.add("active");
      currentMode = button.dataset.mode;

      if (stream) {
        drawOverlay();
      }
    });
  });

  function drawOverlay() {
    overlay.innerHTML = "";

    addGrid();

    const center = document.createElement("div");
    center.className = "center-line";
    overlay.appendChild(center);

    if (currentMode === "on" || currentMode === "arka") {
      drawFrontBackGuide();
    } else {
      drawSideGuide();
    }
  }

  function addGrid() {
    [20, 40, 60, 80].forEach(percent => {
      const v = document.createElement("div");
      v.className = "grid-line-v";
      v.style.left = percent + "%";
      overlay.appendChild(v);

      const h = document.createElement("div");
      h.className = "grid-line-h";
      h.style.top = percent + "%";
      overlay.appendChild(h);
    });
  }

  function addLine(top, left, right) {
    const line = document.createElement("div");
    line.className = "guide-line";
    line.style.top = top + "%";
    line.style.left = left + "%";
    line.style.right = right + "%";
    overlay.appendChild(line);
  }

  function addHead(top, left, right, height) {
    const head = document.createElement("div");
    head.className = "guide-head";
    head.style.top = top + "%";
    head.style.left = left + "%";
    head.style.right = right + "%";
    head.style.height = height + "%";
    overlay.appendChild(head);
  }

  function drawFrontBackGuide() {
    addHead(6, 37, 37, 12);
    addLine(27, 22, 22);
    addLine(49, 31, 31);
    addLine(72, 30, 30);
    addLine(94, 12, 12);

    const left = document.createElement("div");
    left.className = "body-left";
    left.style.left = "38%";
    overlay.appendChild(left);

    const right = document.createElement("div");
    right.className = "body-right";
    right.style.left = "62%";
    overlay.appendChild(right);
  }

  function drawSideGuide() {
    addHead(6, 41, 41, 12);
    addLine(28, 40, 40);
    addLine(50, 40, 40);
    addLine(72, 40, 40);
    addLine(94, 35, 35);
  }

  async function kamerayiAc() {
    const danisan = document.getElementById("danisan").value.trim();

    if (!danisan) {
      alert("Önce danışan adını yaz.");
      return;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert("Bu tarayıcı canlı kamera erişimini desteklemiyor.");
      return;
    }

    try {
      kamerayiKapat();

      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      });

      video.srcObject = stream;
      await video.play();

      drawOverlay();

      cameraCard.classList.remove("hidden");
      previewCard.classList.add("hidden");

      statusBox.className = "status status-ok";
      statusBox.innerText =
        "✓ " + labels[currentMode] + " çekim modu — danışanı rehbere hizala.";
    }

    catch (error) {
      console.error(error);

      cameraCard.classList.remove("hidden");

      statusBox.className = "status status-warn";
      statusBox.innerText =
        "Kamera açılamadı: " +
        (error.name || "Bilinmeyen hata") +
        " — " +
        (error.message || "");
    }
  }

  function kamerayiKapat() {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }

    video.srcObject = null;
  }

  document.getElementById("kameraAc").addEventListener("click", kamerayiAc);

  document.getElementById("kameraKapat").addEventListener("click", () => {
    kamerayiKapat();
    cameraCard.classList.add("hidden");
  });

  document.getElementById("fotoCek").addEventListener("click", () => {
    if (!video.videoWidth || !video.videoHeight) {
      alert("Kamera henüz hazır değil.");
      return;
    }

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

    pendingPhoto = canvas.toDataURL("image/jpeg", 0.9);

    previewCard.classList.remove("hidden");
    cameraCard.classList.add("hidden");

    kamerayiKapat();
  });

  document.getElementById("yeniden").addEventListener("click", kamerayiAc);

  document.getElementById("kullan").addEventListener("click", () => {
    if (!pendingPhoto) {
      alert("Önce fotoğraf çek.");
      return;
    }

    photos[currentMode] = pendingPhoto;

    if (currentMode === "on") {
      document.getElementById("shotOn").src = pendingPhoto;
    }

    if (currentMode === "yan") {
      document.getElementById("shotYan").src = pendingPhoto;
    }

    if (currentMode === "arka") {
      document.getElementById("shotArka").src = pendingPhoto;
    }

    markModeDone(currentMode);

    pendingPhoto = null;
    previewCard.classList.add("hidden");

    autoNextMode();
    updateAnalyzeButton();
  });

  function markModeDone(mode) {
    const button = document.querySelector('.mode-btn[data-mode="' + mode + '"]');

    if (button) {
      button.classList.add("done");
    }
  }

  function autoNextMode() {
    let nextMode = null;

    if (!photos.on) {
      nextMode = "on";
    } else if (!photos.yan) {
      nextMode = "yan";
    } else if (!photos.arka) {
      nextMode = "arka";
    }

    if (!nextMode) return;

    currentMode = nextMode;

    document.querySelectorAll(".mode-btn").forEach(btn => {
      btn.classList.toggle(
        "active",
        btn.dataset.mode === nextMode
      );
    });
  }

  function updateAnalyzeButton() {
    const tamam =
      photos.on &&
      photos.yan &&
      photos.arka;

    if (tamam) {
      analyzeButton.disabled = false;
      analyzeButton.className = "successBtn";
      analyzeButton.innerText = "ANALİZE GEÇ";
    } else {
      analyzeButton.disabled = true;
      analyzeButton.className = "disabledBtn";
      analyzeButton.innerText = "3 FOTOĞRAF TAMAMLANINCA ANALİZE GEÇ";
    }
  }

  analyzeButton.addEventListener("click", () => {
    alert(
      "3 çekim tamamlandı ✓\n\n" +
      "Sonraki sürümde burada anatomik nokta işaretleme ve açı hesaplama ekranına geçeceğiz."
    );
  });

  window.addEventListener("pagehide", kamerayiKapat);
</script>

</body>
</html>
